name: Docker Build CI

on:
  # Push to ks-software registers this workflow with GitHub Actions
  push:
    branches: [ks-software]
    paths: ['.github/workflows/docker-build-ci.yml']

  # API trigger from POST /soft/builds
  workflow_dispatch:
    inputs:
      buildId:
        description: "Build ID from /soft/builds"
        required: true
      callbackUrl:
        description: "Full callback URL: http://<host>/soft/builds/{buildId}"
        required: true
      imageTag:
        description: "Docker image tag (commit SHA or tag name)"
        required: true
        default: "latest"

concurrency:
  group: docker-build-${{ inputs.buildId || 'push' }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Only runs on explicit workflow_dispatch (not on push registration trigger)
    if: github.ref == 'refs/heads/ks-software' && github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    env:
      BUILD_ID:     ${{ inputs.buildId }}
      CALLBACK_URL: ${{ inputs.callbackUrl }}
      IMAGE_TAG:    ${{ inputs.imageTag }}
      REGISTRY:     ghcr.io
      IMAGE_NAME:   ${{ github.repository }}

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Log in to GitHub Container Registry ────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Build Docker image ─────────────────────────────────────
      - name: Build Docker image
        id: build
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:$IMAGE_TAG"
          docker build -t "$IMAGE_REF" framework/
          echo "image_ref=$IMAGE_REF" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── 4. Push image to GHCR ─────────────────────────────────────
      - name: Push Docker image to GHCR
        id: push
        if: steps.build.outcome == 'success'
        run: |
          docker push "${{ steps.build.outputs.image_ref }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${{ steps.build.outputs.image_ref }}" 2>/dev/null || echo "")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── 5. Callback: report BUILT ─────────────────────────────────
      - name: Report BUILT to API
        if: steps.build.outcome == 'success' && steps.push.outcome == 'success'
        run: |
          curl -s -X PATCH "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\":    \"BUILT\",
              \"imageRef\":  \"${{ steps.build.outputs.image_ref }}\",
              \"digest\":    \"${{ steps.push.outputs.digest }}\",
              \"logsRef\":   \"github-actions://docker-build-ci/${{ github.run_id }}/logs\"
            }"
          echo "Reported BUILT to $CALLBACK_URL"

      # ── 6. Callback: report FAILED ────────────────────────────────
      - name: Report FAILED to API
        if: steps.build.outcome != 'success' || steps.push.outcome != 'success'
        run: |
          curl -s -X PATCH "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\":       \"FAILED\",
              \"errorSummary\": \"Docker build or push failed — see run ${{ github.run_id }}\",
              \"logsRef\":      \"github-actions://docker-build-ci/${{ github.run_id }}/logs\"
            }"
          echo "Reported FAILED to $CALLBACK_URL"

      # ── 7. Fail job if build/push failed ──────────────────────────
      - name: Fail job if build failed
        if: steps.build.outcome != 'success' || steps.push.outcome != 'success'
        run: exit 1
