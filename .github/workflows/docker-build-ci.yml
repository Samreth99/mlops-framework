name: Docker Build CI

on:
  # API trigger from POST /soft/builds
  workflow_dispatch:
    inputs:
      buildId:
        description: "Build ID from /soft/builds"
        required: true
      imageTag:
        description: "Docker image tag (commit SHA or tag name)"
        required: true
        default: "latest"

concurrency:
  group: docker-build-${{ inputs.buildId || 'push' }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/ks-software' && github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    env:
      BUILD_ID:     ${{ inputs.buildId }}
      IMAGE_TAG:    ${{ inputs.imageTag }}
      ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
      ECR_REPO:     ${{ secrets.AWS_ECR_REPO_NAME }}

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python & run unit tests ─────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r framework/requirements.txt
          pip install --no-cache-dir -e framework/

      - name: Run unit tests
        id: unit_tests
        run: pytest framework/tests/ -v --tb=short
        continue-on-error: true

      # ── 3. Configure AWS credentials ──────────────────────────────
      - name: Configure AWS credentials
        if: steps.unit_tests.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-north-1

      # ── 4. Login to Amazon ECR ────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr_login
        if: steps.unit_tests.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2

      # ── 5. Build Docker image ─────────────────────────────────────
      - name: Build Docker image
        id: build
        if: steps.unit_tests.outcome == 'success'
        run: |
          IMAGE_REF="$ECR_REGISTRY:$IMAGE_TAG"
          docker build -t "$IMAGE_REF" framework/
          echo "image_ref=$IMAGE_REF" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── 6. Push image to ECR ──────────────────────────────────────
      - name: Push Docker image to ECR
        id: push
        if: steps.unit_tests.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          docker push "${{ steps.build.outputs.image_ref }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${{ steps.build.outputs.image_ref }}" 2>/dev/null || echo "")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── 7. Fail job if any step failed ────────────────────────────
      - name: Fail job if any step failed
        if: steps.unit_tests.outcome != 'success' || steps.build.outcome != 'success' || steps.push.outcome != 'success'
        run: exit 1
