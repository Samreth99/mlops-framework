name: Docker Test CI

on:
  workflow_dispatch:
    inputs:
      testRunId:
        description: "Test run ID from /soft/tests"
        required: true
        type: string
      imageRef:
        description: "Full ECR image URI to pull and test"
        required: true
        type: string
  push:
    branches:
      - ks-software
    paths:
      - ".github/workflows/docker-test-ci.yml"

concurrency:
  group: docker-test-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/ks-software' && github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    env:
      TEST_RUN_ID:       ${{ inputs.testRunId }}
      IMAGE_REF:         ${{ inputs.imageRef }}
      MLOPS_IMAGE: ${{ inputs.imageRef }}

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ──────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-north-1

      # ── 3. Login to Amazon ECR ────────────────────────────────────
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Pull image from ECR ────────────────────────────────────
      - name: Pull Docker image from ECR
        run: docker pull "$IMAGE_REF"

      # ── 5. Create framework/.env for docker compose ──────────────
      - name: Create framework/.env
        run: |
          cat > framework/.env <<EOF
          MLFLOW_TRACKING_URI=http://mlflow:5000/
          MLFLOW_ARTIFACT_ROOT=s3://mlops-storage/mlflow
          MLFLOW_EXPERIMENT_NAME=Default
          DEFAULT_DATASET_PATH=src/mlops/dimensions/data/data-storage/breast_train.csv
          DEFAULT_TEST_DATASET_PATH=src/mlops/dimensions/data/data-storage/breast_test.csv
          GH_DISPATCH_TOKEN=${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPO_OWNER=Samreth99
          GH_REPO_NAME=mlops-framework
          PUBLIC_API_URL=
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ECR_LOGIN_URI=000000000000.dkr.ecr.eu-north-1.amazonaws.com/mlops/framework
          AWS_ECR_REPO_NAME=mlops/framework
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=
          REDIS_DB=0
          REDIS_FEATURE_TTL=0
          EOF

      # ── 6. Start full stack with docker compose ───────────────────
      # MLOPS_IMAGE is picked up by docker-compose.yml
      # so the api service uses the ECR image instead of building
      - name: Start full stack (redis + mlflow + api)
        run: docker compose up -d
        env:
          MLOPS_IMAGE: ${{ inputs.imageRef }}

      # ── 7. Wait for API to be ready ───────────────────────────────
      - name: Wait for API health
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying..."
            sleep 3
          done
          echo "API did not become healthy in time"
          docker compose logs api
          exit 1

      # ── 8. Set up Python & run tests ──────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r framework/requirements.txt
          pip install --no-cache-dir -e framework/

      - name: Run unit tests
        id: unit_tests
        run: pytest framework/tests/unit/ -v --tb=short
        continue-on-error: true

      - name: Run integration tests
        id: integration_tests
        run: pytest framework/tests/integration/ -v --tb=short
        env:
          API_BASE_URL: http://localhost:8000
        continue-on-error: true

      # ── 9. Smoke test against running stack ───────────────────────
      - name: Smoke test API endpoints
        id: smoke_tests
        run: |
          echo "Testing /health..."
          curl -sf http://localhost:8000/health

          echo "Testing /soft/builds (list)..."
          curl -sf http://localhost:8000/soft/builds

          echo "Testing /model/experiments (list)..."
          curl -sf http://localhost:8000/model/experiments || true
        continue-on-error: true

      # ── 10. Stop full stack ───────────────────────────────────────
      - name: Stop full stack
        if: always()
        run: docker compose down

      # ── 11. Fail job if any step failed ───────────────────────────
      - name: Fail job if any step failed
        if: steps.unit_tests.outcome != 'success' || steps.integration_tests.outcome != 'success' || steps.smoke_tests.outcome != 'success'
        run: exit 1
