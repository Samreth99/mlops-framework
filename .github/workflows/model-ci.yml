name: Model Dimension CI (model-suite)

on:
  # Push trigger registers this workflow with GitHub Actions on ks-software
  push:
    branches: [ks-software]
    paths: ['.github/workflows/model-ci.yml']

  # Manual/API trigger from POST /soft/tests
  workflow_dispatch:
    inputs:
      testRunId:
        description: "Test Run ID from /soft/tests"
        required: true
      callbackUrl:
        description: "Full callback URL: http://<host>/soft/tests/{testRunId}"
        required: true
      apiBaseUrl:
        description: "Base URL of the API (used when imageRef is empty)"
        required: true
        default: "http://localhost:8000"
      imageRef:
        description: "Docker image to start as the API (e.g. ghcr.io/owner/repo:sha). Leave empty to use apiBaseUrl directly."
        required: false
        default: ""

concurrency:
  group: model-ci-suite
  cancel-in-progress: true

jobs:
  run-model-tests:
    runs-on: ubuntu-latest

    # Only runs on explicit workflow_dispatch (not on push registration trigger)
    if: github.ref == 'refs/heads/ks-software' && github.event_name == 'workflow_dispatch'

    env:
      TEST_RUN_ID:        ${{ inputs.testRunId }}
      CALLBACK_URL:       ${{ inputs.callbackUrl }}
      API_BASE_URL:       ${{ inputs.apiBaseUrl }}
      IMAGE_REF:          ${{ inputs.imageRef }}
      ACCURACY_THRESHOLD: "0.80"

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. (Docker path) Log in to GHCR ───────────────────────────
      - name: Log in to GHCR
        if: inputs.imageRef != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. (Docker path) Start API container ──────────────────────
      - name: Start API container from Docker image
        if: inputs.imageRef != ''
        run: |
          docker pull "$IMAGE_REF"
          docker run -d --name mlops-api \
            -p 8000:8000 \
            "$IMAGE_REF"
          echo "API container started from $IMAGE_REF"
          echo "API_BASE_URL=http://localhost:8000" >> $GITHUB_ENV

      # ── 4. (pip path) Set up Python & install deps ────────────────
      - name: Set up Python 3.11
        if: inputs.imageRef == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: inputs.imageRef == ''
        run: |
          pip install --upgrade pip
          pip install httpx pytest pytest-html
          pip install -e framework/

      # ── 5. Wait for API to be reachable ───────────────────────────
      - name: Wait for API health check
        run: |
          echo "Waiting for API at $API_BASE_URL ..."
          for i in $(seq 1 15); do
            if curl -sf "$API_BASE_URL/health" > /dev/null 2>&1; then
              echo "API is up!"
              break
            fi
            echo "Attempt $i/15 — retrying in 5s..."
            sleep 5
          done

      # ── 6. Install test dependencies (always needed for pytest) ───
      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install httpx pytest pytest-html

      # ── 7. Run pytest model suite ─────────────────────────────────
      - name: Run model test suite
        id: pytest
        run: |
          pytest tests/model_suite.py \
            --html=reports/model-report.html \
            --self-contained-html \
            -v
        env:
          API_BASE_URL:       ${{ env.API_BASE_URL }}
          ACCURACY_THRESHOLD: ${{ env.ACCURACY_THRESHOLD }}
        continue-on-error: true  # always run callback even on failure

      # ── 8. Stop API container ─────────────────────────────────────
      - name: Stop API container
        if: inputs.imageRef != '' && always()
        run: docker stop mlops-api || true

      # ── 9. Callback to API with real result ───────────────────────
      - name: Report result to API (PASSED)
        if: steps.pytest.outcome == 'success'
        run: |
          curl -s -X PATCH "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "status":    "PASSED",
              "passed":    true,
              "reportRef": "github-actions://model-ci/${{ github.run_id }}/report"
            }'
          echo "Reported PASSED to $CALLBACK_URL"

      - name: Report result to API (FAILED)
        if: steps.pytest.outcome != 'success'
        run: |
          curl -s -X PATCH "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "status":    "FAILED",
              "passed":    false,
              "reportRef": "github-actions://model-ci/${{ github.run_id }}/report"
            }'
          echo "Reported FAILED to $CALLBACK_URL"

      # ── 10. Upload test report as artifact ────────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-test-report-${{ github.run_id }}
          path: reports/model-report.html

      # ── 11. Fail the job if tests failed ──────────────────────────
      - name: Fail job if tests failed
        if: steps.pytest.outcome != 'success'
        run: exit 1
