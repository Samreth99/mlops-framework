services:
  redis:
    image: redis:7-alpine
    container_name: mlops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Enable AOF persistence so data survives container restart
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1-full
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./framework
    image: ${MLOPS_IMAGE:-mlops:latest}
    container_name: mlops-api
    ports:
      - "8000:8000"
    env_file:
      - ./framework/.env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000/
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  redis_data:
  mlflow_data:
